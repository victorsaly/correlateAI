name: 🤖 Automated Data Collection

# Weekly refresh of the real, no-key public datasets the app serves
# (public/data/*.json + public/data/real_list.json). Every collector needs no
# API key. Flow: collect → validate → commit → redeploy → alert on failures.
#
# - A source that fails keeps its last good data (collect-real-sources.mjs),
#   so one flaky API never removes series from the site.
# - Data that fails validation is never committed.
# - Pushes made with GITHUB_TOKEN don't trigger other workflows, so the deploy
#   is dispatched explicitly; otherwise refreshed data would never go live.
# - Any failed source or carried-forward series fails the run and opens
#   (or comments on) a single tracking issue.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, validate & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COLLECT_REPORT: /tmp/collect-report.json

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect real sources
        run: node scripts/collect-real-sources.mjs

      - name: Validate data
        run: node scripts/validate-real-data.mjs

      - name: Commit & push changes
        id: commit
        run: |
          git config user.name "CorrelateAI Data Pipeline"
          git config user.email "action@github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes this week."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --staged --name-only | wc -l | tr -d ' ')
          TOTAL=$(jq '.total' "$COLLECT_REPORT")
          git commit -m "🤖 Data update $(date -u +%Y-%m-%d): $FILES file(s) changed, $TOTAL datasets [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Run summary & health check
        if: always()
        run: |
          R="$COLLECT_REPORT"
          if [ ! -f "$R" ]; then
            echo "## ❌ Collection did not produce a report" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## Data collection"
            echo "**$(jq '.refreshed' "$R")** refreshed of **$(jq '.total' "$R")** datasets"
            echo
            echo "| Source | Refreshed | Problem |"
            echo "|---|---:|---|"
            jq -r '.sources[] | "| \(.source) | \(.written) | \(.error // ([.skipped[] | "\(.id): \(.reason)"] | join("; "))) |"' "$R"
            echo
            jq -r 'if (.added | length) > 0 then "**New:** \(.added | join(", "))" else empty end' "$R"
            jq -r 'if (.carriedForward | length) > 0 then "**Kept previous (not refreshed):** \(.carriedForward | join(", "))" else empty end' "$R"
            jq -r 'if (.dropped | length) > 0 then "**Retired:** \(.dropped | join(", "))" else empty end' "$R"
          } >> "$GITHUB_STEP_SUMMARY"
          PROBLEMS=$(jq '([.sources[] | select(.error != null or (.skipped | length) > 0)] | length) + (.carriedForward | length)' "$R")
          if [ "$PROBLEMS" -gt 0 ]; then
            echo "::error::$PROBLEMS collection problem(s) — see the run summary. Previous data was kept for anything that failed."
            exit 1
          fi

      - name: Open or update tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Automated data collection needs attention'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The weekly data collection on ${new Date().toISOString().slice(0, 10)} reported problems.\n\n` +
              `See the [run summary](${run}) for which sources failed. Series that failed kept their previous data, ` +
              `and invalid data is never committed, so the site is unaffected until this is fixed.`
            // the label may not exist yet (first failure): create it, ignoring "already exists"
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: 'data-pipeline', color: 'd93f0b', description: 'Automated data collection' })
            } catch (e) {
              if (e.status !== 422) throw e
            }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'data-pipeline' })
            const existing = open.find((i) => i.title === title)
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['data-pipeline'] })
            }
