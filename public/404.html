<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | CorrelateAI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <style>
    :root { color-scheme: light dark; --bg: #f7f8f4; --fg: #1d2a2e; --muted: #56656a; --pencil: #b8322a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a2a4c; --fg: #eef4fa; --muted: #aac4de; --pencil: #ff8f80; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.5 'Atkinson Hyperlegible Next', system-ui, sans-serif; }
    main { max-width: 34rem; padding: 2rem 1rem; }
    h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 1rem 0 0.5rem; }
    p { color: var(--muted); }
    a { color: var(--fg); text-underline-offset: 0.2em; }
    .r { font-family: ui-monospace, monospace; font-size: 3rem; border: 2px solid var(--pencil); border-radius: 999px; padding: 0 1rem; color: var(--pencil); display: inline-block; }
  </style>
</head>
<body>
  <main>
    <span class="r">r = ?</span>
    <h1>This page doesn’t exist</h1>
    <p>The link may be mistyped, or the dataset it pointed to is no longer in the catalog.</p>
    <p><a href="/">Explore a pair</a> · <a href="/?view=gallery">Browse the gallery</a></p>
  </main>
</body>
</html>
